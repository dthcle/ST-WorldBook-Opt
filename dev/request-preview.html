<!doctype html><html lang="zh-CN" data-wbo-preview><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>免费请求差异预览测试</title><link rel="stylesheet" href="../style.css"><style>body{background:#111723;color:#e4e8f0;font:16px system-ui;margin:24px}textarea{width:min(600px,100%);height:100px;background:#222c3b;color:inherit;padding:12px;border:1px solid #556;border-radius:8px}#extensionsMenu{max-width:400px;border:1px solid #445;margin:16px 0}.wbo-panel p{font-size:14px}</style><h1>请求诊断·模拟环境</h1><p>此测试页使用内存模拟酒馆，模型请求次数保持为0。</p><div id="extensionsMenu"></div><label for="send_textarea">待发送输入（不发送）</label><br><textarea id="send_textarea">去海边寻找灯塔</textarea><p id="checks" role="status"></p><script type="module">
import {initDiagnostics} from '../index.js';
import {createRequestPreview} from '../request-preview.js';
const events={GENERATE_AFTER_DATA:'data',GENERATION_STARTED:'started',WORLDINFO_SCAN_DONE:'wi'};
let calls=0;
const baseChat=[{name:'用户',is_user:true,mes:'你好'},{name:'角色',is_user:false,mes:'你好，想去哪里？'}];
const context={characterId:0,groupId:null,chatId:'mock-chat',mainApi:'openai',name1:'用户',chat:structuredClone(baseChat),chatMetadata:{},extensionPrompts:{},extensionSettings:{},characters:[{name:'角色'}],powerUserSettings:{},chatCompletionSettings:{chat_completion_source:'custom'},eventTypes:events,eventSource:{async emit(){}},getChatCompletionModel:()=> 'mock-model',substituteParams:s=>s};
const host={location:{origin:location.origin},async fetch(){calls++;return new Response('{}')}};
context.generate=async(type,options,dryRun)=>{if(!dryRun)throw Error('Test must not generate');const input=context.chat.at(-1).mes;const prefix=[{role:'system',content:'世界设定：现代城市。'},{role:'user',content:input.includes('海边')?'海边世界书触发：灯塔位于海港东侧。':'城市世界书触发：广场位于中心。'}];const history=context.chat.map(x=>({role:x.is_user?'user':'assistant',content:x.mes}));await context.eventSource.emit(events.GENERATE_AFTER_DATA,{prompt:[...prefix,...history]},true)};
const runtime=createRequestPreview({getContext:()=>context,host,activeBooks:async()=>[]});
await host.fetch('/api/backends/chat-completions/generate',{method:'POST',body:JSON.stringify({model:'mock-model',chat_completion_source:'custom',messages:[{role:'system',content:'世界设定：现代城市。'},{role:'user',content:'城市世界书触发：广场位于中心。'},{role:'user',content:'你好'}],proxy_password:'DO_NOT_RETAIN'})});
await initDiagnostics(async()=>runtime);
const before=JSON.stringify(context.chat);setInterval(()=>{document.getElementById('checks').textContent=`基线模拟发送次数：${calls}（应一直为1，非真实模型调用） · 聊天恢复：${JSON.stringify(context.chat)===before?'PASS':'预览进行中'} · 输入框：${document.getElementById('send_textarea').value}`},500);
</script></html>
