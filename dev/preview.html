<!doctype html>
<html lang="zh-CN" data-wbo-preview><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WorldBook Opt 样式兼容测试</title><link rel="stylesheet" href="../style.css">
<style>
/* Deliberately loaded after extension CSS: reproduce host icon-button sizing. */
body{background:#111723;color:#e4e8f0;font-family:system-ui;margin:24px;font-size:20px}
button,.menu_button{width:40px;min-width:40px;white-space:normal;overflow-wrap:anywhere;font-size:inherit;background:#252c3c;color:inherit}
/* Minimal stand-in for SillyTavern's own inline-drawer styling. */
.inline-drawer-toggle{display:flex;justify-content:space-between;align-items:center;cursor:pointer;padding:8px 10px;border:1px solid #3d4654;border-radius:8px;background:#1d2431}
body.compact{width:340px;max-width:calc(100vw - 16px);margin:8px}
</style>
<h1 style="font-size:20px">WorldBook Opt · 宿主样式回归测试</h1>
<p style="font-size:14px">测试页刻意设置通用按钮宽40px，验证抽屉入口与面板不受影响。</p>
<p id="layout-result" role="status" style="font-size:14px"></p><button id="layout-check">检查布局</button>
<script type="module">
import {buildSettingsDrawer} from '../index.js';
import {mountOptimizer} from '../ui.js';
const entry=(uid,content,extra={})=>({uid,comment:['世界背景','规则与叙事','当前变量','禁用测试','固定尾部'][uid],content,key:['故事'],keysecondary:[],disable:false,constant:false,selective:false,position:0,order:100,cooldown:0,...extra});
let book={entries:{0:entry(0,'这是一座海边城市，旧灯塔守望着永恒的潮汐。'),1:entry(1,'保持人物性格一致，不要替用户做决定。',{position:4,depth:12,role:0,constant:true}),2:entry(2,'当前情绪：{{getvar::mood}}',{position:0,order:80}),3:entry(3,'禁用条目正文',{disable:true}),4:entry(4,'自然描写环境，避免重复套话。',{constant:true,position:4,depth:0,role:1})}};
if(new URL(location.href).searchParams.has('uuid')) {
  book.entries=Object.fromEntries(Object.values(book.entries).map((item,i)=>{const uid=`00000000-0000-4000-8000-${String(i+1).padStart(12,'0')}`;return [uid,{...item,uid}]}));
}
let cache=structuredClone(book),backups=[];
const adapter={async list(){return ['测试世界书']},async read(){return structuredClone(book)},cached(){return structuredClone(cache)},async write(n,data){book=structuredClone(data);cache=structuredClone(data)},getBackups(){return structuredClone(backups)},putBackups(data){backups=structuredClone(data)}};
if(new URL(location.href).searchParams.has('compact'))document.body.classList.add('compact');
const host=document.createElement('div');host.id='extensions_settings2';document.body.append(host);
const drawer=buildSettingsDrawer([
  {label:'打开世界书优化器',id:'wbo-open',run:()=>{if(!document.querySelector('.wbo-overlay'))mountOptimizer(adapter)}},
  {label:'请求输入差异',run:()=>{}},
]);
drawer.querySelector('.inline-drawer-content').style.display='';
host.append(drawer);
function check(){
  const buttons=[...document.querySelectorAll('.wbo-button')].filter(x=>x.getClientRects().length);
  const bad=buttons.filter(x=>{const r=x.getBoundingClientRect();return r.height>60||x.scrollWidth>x.clientWidth+1||getComputedStyle(x).whiteSpace!=='nowrap'});
  const panel=document.querySelector('.wbo-panel');
  const overflow=panel&&panel.scrollWidth>panel.clientWidth+1;
  const overlay=document.querySelector('.wbo-overlay');
  const clipped=overlay?overlay.scrollHeight>overlay.clientHeight&&overlay.scrollTop===0&&overlay.firstElementChild.getBoundingClientRect().top<0:false;
  document.getElementById('layout-result').textContent=(bad.length||overflow||clipped)
    ? `FAIL：${bad.length} 个按钮异常，面板溢出 ${Boolean(overflow)}，顶部被裁切 ${Boolean(clipped)}`
    : `PASS：${buttons.length} 个按钮横向显示、无截断，面板无横向溢出，顶部未裁切`;
}
document.getElementById('layout-check').onclick=check;document.addEventListener('click',()=>setTimeout(check,0));requestAnimationFrame(check);
</script></html>
