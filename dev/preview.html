<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WorldBook Opt 测试预览</title><link rel="stylesheet" href="../style.css"><style>body{background:#111723;color:#e4e8f0;font-family:system-ui;margin:30px}</style><h1>WorldBook Opt · 独立测试环境</h1><p>这里仅操作内存中的模拟世界书，不连接真实酒馆。</p><button id="open">打开优化器</button><script type="module">
